// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.gtbluesky.onnxruntime'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.gtbluesky.onnxruntime'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main.jniLibs.srcDirs += 'onnxruntime/jni'
    }
}

// The plugin only uses ORT via FFI, so we just need libonnxruntime.so per ABI from the AAR.
def ortVersion = '1.22.0'
def ortJniDir = file('onnxruntime/jni')
if (!ortJniDir.exists()) {
    def aar = file("onnxruntime/onnx-android-${ortVersion}.aar")
    aar.parentFile.mkdirs()
    println "Downloading ONNX Runtime ${ortVersion} for Android from Artifactory..."
    // ONNXRUNTIME_DEPS_URL env var overrides the default base URL
    def baseUrl = System.getenv("ONNXRUNTIME_DEPS_URL") ?: "https://repo.devops.ptech.io/artifactory/tools/onnx-runtime/${ortVersion}"
    new URL("${baseUrl}/onnx-android.aar")
        .withInputStream { i -> aar.withOutputStream { it << i } }
    copy {
        from zipTree(aar)
        include 'jni/*/libonnxruntime.so'
        into file('onnxruntime')
    }
    aar.delete()
}